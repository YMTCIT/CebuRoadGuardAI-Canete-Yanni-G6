{% if form.non_field_errors %}<div class="form-error-block">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="form-field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-label="required">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="field-error" role="alert">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
